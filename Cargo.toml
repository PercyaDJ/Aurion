[package]
name = "aurora-cam"
version = "0.1.0"
edition = "2021"
description = "Autonomous aurora capture camera for Raspberry Pi"
authors = ["AuroraCam"]

[features]
default = []
rpi = []

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
tower = "0.4"
async-trait = "0.1"
anyhow = "1"
