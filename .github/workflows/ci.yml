name: CI

# Tests d'une pull request, en un seul job (une machine, un cache, une mise en route).
# Pas de passage sur push : la même modification serait testée deux fois (push puis PR).
# Un nouveau push sur la PR annule le passage en cours. Documentation seule : pas de CI.
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Tests only (never shipped): our code built with light optimizations and
  # without debug info. Night simulations run about 3x faster and the binary
  # links faster; debug assertions and overflow checks stay on.
  CARGO_PROFILE_DEV_OPT_LEVEL: 1
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test:
    name: Tests (unitaires, API, sécurité, simulation, non-régression, navigateur, image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A change that ships (code, scripts, image) with a version already
      # published is merged without any release: nothing new for the cameras,
      # no Lysbor scan. Said here, in the PR, before the merge.
      - name: Version à publier ?
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ -n "$BASE" ] && gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            git fetch -q --depth=1 origin "$BASE"
            if git diff --name-only "$BASE" HEAD | grep -qE '^(src/|Cargo\.|scripts/|deploy/|config/|keys/)'; then
              msg="La version $v est déjà publiée : à la fusion, rien ne sera publié ni envoyé à Lysbor. Montez la version dans Cargo.toml pour livrer ce changement."
              echo "::warning::$msg"
              echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Version $v : publiée à la fusion (release, image, Lysbor)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: aurion-ci
      - name: Clippy (PC)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy (Raspberry Pi)
        run: cargo clippy --locked --all-targets --features rpi -- -D warnings
      - name: Tests Rust
        run: cargo test --locked

      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh scripts/aurion-helper tests/*.sh install.sh deploy/*.sh
      - name: Tests aurion-helper (validation des arguments root)
        run: bash tests/helper_test.sh
      # Binary built by "cargo test" (integration tests): a separate "cargo
      # build" would recompile every dependency (features of the dev-dependencies)
      - name: Simulation de l'installeur
        run: sudo -E bash tests/install_test.sh target/debug/aurion

      # Node and Google Chrome are preinstalled on the runner: no download
      - name: Tests navigateur de l'interface
        working-directory: tests/e2e
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          npm ci --no-audit --no-fund
          node ui_test.mjs

      # Cross-compilation and SD image test only when packaging can have changed
      - name: Fichiers d'empaquetage modifiés ?
        id: pkg
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch -q --depth=1 origin "$BASE"
          if git diff --name-only "$BASE" HEAD | grep -qE \
            '^(Cargo\.(toml|lock)|scripts/(package|install|build-image|image-sbom)\.sh|scripts/aurion-helper|deploy/|config/|keys/|tests/image_test\.sh|\.github/workflows/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Archive et paquet Raspberry Pi (arm64)
        if: steps.pkg.outputs.run == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu parted mtools dosfstools
          bash scripts/package.sh
          dpkg-deb -I dist/aurion_*_arm64.deb && dpkg-deb -c dist/aurion_*_arm64.deb
          # Update package installed from the phone: what aurion-helper app-update expects
          tar -tzf dist/aurion-update.tar.gz | tee /dev/stderr | sort >/tmp/paquet.txt
          for f in ./aurion ./aurion-helper ./install.sh ./deploy/aurion.service ./deploy/99-aurion-usb.rules \
                   ./config/default.json ./keys/aurion-signing.pub ./keys/aurion-secours.pub; do
            grep -qx "$f" /tmp/paquet.txt || { echo "::error::$f absent de aurion-update.tar.gz"; exit 1; }
          done
      - name: Test de fabrication de l'image carte SD
        if: steps.pkg.outputs.run == 'true'
        run: sudo bash tests/image_test.sh
