name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (unitaires, API, sécurité, simulation, non-régression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy (PC)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy (Raspberry Pi)
        run: cargo clippy --locked --all-targets --features rpi -- -D warnings
      - name: Tests Rust
        run: cargo test --locked

      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh scripts/aurion-helper tests/*.sh
      - name: Tests aurion-helper (validation des arguments root)
        run: bash tests/helper_test.sh
      - name: Simulation de l'installeur
        run: cargo build --locked && sudo -E bash tests/install_test.sh target/debug/aurion

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Tests navigateur de l'interface
        working-directory: tests/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright-core install --with-deps chromium
          node ui_test.mjs

  package:
    name: Archive Raspberry Pi (arm64)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cross-compilation
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          bash scripts/package.sh
      - name: Contrôle du paquet .deb
        run: dpkg-deb -I dist/aurion_*_arm64.deb && dpkg-deb -c dist/aurion_*_arm64.deb
      - name: Test de fabrication de l'image carte SD
        run: |
          sudo apt-get install -y parted mtools dosfstools
          sudo bash tests/image_test.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aurion-rpi-arm64
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.sha256
