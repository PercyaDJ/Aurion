name: Release

# Publication automatique : à chaque push sur main, si la release de la
# version de Cargo.toml n'existe pas encore, elle est construite et publiée
# (image carte SD prête à flasher, paquet .deb, archive). Pas de tag à créer
# à la main : il est créé par cette action.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version à publier
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release v$v existe déjà : rien à publier."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.skip == 'false'
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.skip == 'false'

      - name: Tests
        if: steps.version.outputs.skip == 'false'
        run: cargo test --locked

      - name: Archive et paquet Raspberry Pi
        if: steps.version.outputs.skip == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user-static binfmt-support parted mtools
          bash scripts/package.sh

      - name: Image carte SD (Raspberry Pi OS Lite 64 bits + Aurion)
        if: steps.version.outputs.skip == 'false'
        run: |
          v=${{ steps.version.outputs.version }}
          sudo bash scripts/build-image.sh "dist/aurion-$v-rpi-arm64" "dist/aurion-$v-raspios-arm64.img.xz"

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.skip == 'false'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Aurion ${{ steps.version.outputs.version }}
          body: |
            ## Installation (aucune connaissance technique nécessaire)

            1. Téléchargez **aurion-${{ steps.version.outputs.version }}-raspios-arm64.img.xz** ci-dessous.
            2. Avec **Raspberry Pi Imager** : *Choisir l'OS* → *Utiliser une image personnalisée* → ce fichier.
               Répondez **Non** à la question des réglages personnalisés.
            3. Carte SD dans le Raspberry Pi, caméra et clé USB branchées, allumez.
            4. Après 3 à 5 minutes, rejoignez le Wi-Fi **Aurion** (mot de passe **aurora2024**) : la page s'ouvre toute seule.

            Guide pas à pas : docs/GUIDE_DEMARRAGE.md

            Autres fichiers : paquet `.deb` (`sudo apt install ./aurion_*.deb`) et archive `.tar.gz`
            pour une installation sur un Raspberry Pi OS existant, fichier `aurion` pour la mise à jour
            depuis le téléphone (dans l'archive).
          files: |
            dist/*.img.xz
            dist/*.tar.gz
            dist/*.deb
            dist/*.sha256
