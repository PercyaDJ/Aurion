name: Release

# Un seul job par push sur main (documentation seule : rien) :
# - toujours : binaire Raspberry Pi publié dans la pré-release "edge" (canal Développement,
#   installable depuis le téléphone en quelques minutes) ;
# - si la release de la version de Cargo.toml n'existe pas encore : tests, image carte SD,
#   paquet .deb, archive, SBOM, release GitHub (tag créé ici), puis envoi des SBOM à ARBOR.
# Une release compile une seule fois : son binaire sert aussi de binaire edge.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Edge, et release si nouvelle version
    runs-on: ubuntu-latest
    # The signing key is a secret of this environment: the job only starts
    # once the owner approves it (Settings > Environments > release)
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No write token left in .git/config for the build and test steps
          # (dependency build scripts, downloaded installers)
          persist-credentials: false
      - name: Version à publier
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Only "not found" means a new release: an API failure must not
          # rebuild and overwrite the files of an existing one
          if out=$(gh release view "v$v" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1); then
            echo "La release v$v existe déjà : binaire edge seulement."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif grep -qi "not found" <<<"$out"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::API GitHub : $out"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: aurion-release

      - name: Tests
        if: steps.version.outputs.skip == 'false'
        run: |
          cargo test --locked
          # The root helper and the installer ship in the release too
          bash tests/helper_test.sh
          shellcheck -S warning scripts/*.sh scripts/aurion-helper tests/*.sh install.sh deploy/*.sh

      - name: Binaire Raspberry Pi (arm64, statique)
        id: build
        run: |
          v=${{ steps.version.outputs.version }}
          sudo apt-get update
          if [ "${{ steps.version.outputs.skip }}" = "false" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user-static binfmt-support parted mtools
            # Archive and .deb; the bare binary is also used by the phone update
            bash scripts/package.sh
            cp "dist/aurion-$v-rpi-arm64/aurion" dist/aurion-arm64
            build=$v
          else
            sudo apt-get install -y gcc-aarch64-linux-gnu
            build="$v-edge.${GITHUB_SHA::7}"
            # Same packaging as a release: the phone installs aurion-update.tar.gz
            AURION_BUILD=$build bash scripts/package.sh
            cp "dist/aurion-$v-rpi-arm64/aurion" dist/aurion-arm64
          fi
          (cd dist && sha256sum aurion-arm64 > aurion-arm64.sha256 && sha256sum aurion-update.tar.gz > aurion-update.tar.gz.sha256)
          echo "build=$build" >> "$GITHUB_OUTPUT"

      # The Pi only installs what is signed with keys/aurion-signing.pub (or
      # the offline backup key): without the signature it would be refused.
      # aurion-update.tar.gz: application and system files (Aurion 1.13+);
      # aurion-arm64: the bare binary, for cameras still on 1.12.
      - name: Signature du binaire et du paquet de mise à jour
        env:
          AURION_SIGNING_KEY: ${{ secrets.AURION_SIGNING_KEY }}
        run: |
          if [ -z "$AURION_SIGNING_KEY" ]; then
            echo "::error::Secret AURION_SIGNING_KEY absent de l'environnement release : les Pi refuseraient ce binaire."
            exit 1
          fi
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$AURION_SIGNING_KEY" >"$key"
          for f in aurion-arm64 aurion-update.tar.gz; do
            openssl pkeyutl -sign -rawin -inkey "$key" -in "dist/$f" -out "dist/$f.sig"
            # The secret must be the private half of the key built into Aurion
            openssl pkeyutl -verify -pubin -inkey keys/aurion-signing.pub -rawin \
              -in "dist/$f" -sigfile "dist/$f.sig"
          done

      - name: Déplacer le tag edge sur ce commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Through the API: the token stays in this step only
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/edge" -f sha="$GITHUB_SHA" -F force=true >/dev/null \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/edge -f sha="$GITHUB_SHA" >/dev/null
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: edge
          name: Développement (${{ steps.build.outputs.build }})
          prerelease: true
          make_latest: false
          body: |
            Version de développement **${{ steps.build.outputs.build }}**, reconstruite à chaque modification de `main`.
            Installation depuis le téléphone : *Diagnostics*, *Mettre à jour depuis GitHub*, canal *Développement*.
            Retour à la version précédente en un geste sur la même page. Pour une nuit importante, préférez la
            dernière version stable.
          files: |
            dist/aurion-arm64
            dist/aurion-arm64.sha256
            dist/aurion-arm64.sig
            dist/aurion-update.tar.gz
            dist/aurion-update.tar.gz.sha256
            dist/aurion-update.tar.gz.sig

      - name: Image carte SD (Raspberry Pi OS Lite 64 bits + Aurion)
        if: steps.version.outputs.skip == 'false'
        run: |
          v=${{ steps.version.outputs.version }}
          # Same name for every version: permanent link .../releases/latest/download/aurion-raspios-arm64.img.xz
          sudo bash scripts/build-image.sh "dist/aurion-$v-rpi-arm64" "dist/aurion-raspios-arm64.img.xz"

      - name: SBOM CycloneDX de la version (application et image)
        if: steps.version.outputs.skip == 'false'
        run: |
          v=${{ steps.version.outputs.version }}
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/v1.20.0/install.sh \
            | sudo sh -s -- -b /usr/local/bin v1.20.0
          syft scan dir:. --exclude ./target --exclude ./dist \
            --source-name aurion --source-version "$v" -o cyclonedx-json=dist/aurion-sbom.cdx.json
          sudo bash scripts/image-sbom.sh dist/aurion-raspios-arm64.img.xz dist/aurion-image-sbom.cdx.json "$v"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: steps.version.outputs.skip == 'false'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Aurion ${{ steps.version.outputs.version }}
          body: |
            ## Installation : un seul fichier, système + application

            1. Téléchargez **aurion-raspios-arm64.img.xz** ci-dessous (environ 600 Mo : Raspberry Pi OS + Aurion).
            2. Avec **Raspberry Pi Imager** : *Choisir l'OS* → *Utiliser une image personnalisée* → ce fichier.
               Répondez **Non** à la question des réglages personnalisés.
            3. Carte SD dans le Raspberry Pi, caméra et clé USB branchées, allumez.
            4. Après 3 à 5 minutes, rejoignez le Wi-Fi **Aurion** (mot de passe **aurora2024**) : la page s'ouvre toute seule.

            Lien permanent vers la dernière version : https://github.com/PercyaDJ/Aurion/releases/latest/download/aurion-raspios-arm64.img.xz

            Mettre à jour ensuite : l'application depuis le téléphone (*Diagnostics*, *Mettre à jour depuis GitHub*) ;
            le système en regravant cette image. Les photos et les réglages restent sur la clé USB.

            Guide pas à pas : docs/GUIDE_DEMARRAGE.md

            Autres fichiers : paquet `.deb` (`sudo apt install ./aurion_*.deb`) et archive `.tar.gz`
            pour une installation sur un Raspberry Pi OS existant. `aurion-update.tar.gz` : utilisé par la mise à
            jour depuis le téléphone (Diagnostics, *Mettre à jour depuis GitHub*), programme et fichiers système,
            signé (`.sig`). `aurion-arm64` et sa signature : programme seul, pour les caméras en 1.12 et l'envoi par
            fichier (choisir les deux). `aurion-sbom.cdx.json` et
            `aurion-image-sbom.cdx.json` : inventaires CycloneDX de l'application et du système de l'image.
          files: |
            dist/*.img.xz
            dist/*.tar.gz
            dist/*.deb
            dist/*.sha256
            dist/aurion-arm64
            dist/aurion-arm64.sig
            dist/aurion-update.tar.gz
            dist/aurion-update.tar.gz.sig
            dist/*.cdx.json

      # Straight after the release: the image just published and the code it was built from
      - name: Envoi à ARBOR (Aurion_Image, puis Aurion_Application)
        if: steps.version.outputs.skip == 'false'
        env:
          ARBOR_API_KEY: ${{ secrets.ARBOR_API_KEY }}
          ARBOR_IMAGE_API_KEY: ${{ secrets.ARBOR_IMAGE_API_KEY }}
        run: |
          bash scripts/arbor-scan.sh image dist/aurion-image-sbom.cdx.json
          bash scripts/arbor-scan.sh app dist/aurion-sbom.cdx.json
