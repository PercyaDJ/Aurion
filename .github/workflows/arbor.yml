name: ARBOR

# Renvoi manuel à ARBOR (https://arbor.norkenix.com), sans nouvelle release : onglet Actions,
# "ARBOR", "Run workflow". Chaque envoi remplace l'inventaire du projet.
# - Aurion_Application : SBOM Syft du dépôt, Semgrep (code), Trivy (secrets, configuration) ;
# - Aurion_Image : SBOM de l'image de la dernière release, publié avec elle (aurion-image-sbom.cdx.json).
#   L'image ne change qu'à une release : le SBOM publié suffit, sans télécharger ni monter 400 Mo.
# L'envoi normal a lieu à chaque release, dans le workflow Release lui-même : pas de passage planifié.
# Une clé par projet : ARBOR_API_KEY (application), ARBOR_IMAGE_API_KEY (image).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arbor
  cancel-in-progress: false

jobs:
  arbor:
    name: Aurion_Application et Aurion_Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Aurion_Image (SBOM de la dernière release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARBOR_IMAGE_API_KEY: ${{ secrets.ARBOR_IMAGE_API_KEY }}
          ARBOR_REQUIRED: "1"
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" -p aurion-image-sbom.cdx.json -D "$RUNNER_TEMP"
          bash scripts/arbor-scan.sh image "$RUNNER_TEMP/aurion-image-sbom.cdx.json"

      - name: Aurion_Application (SBOM, Semgrep, Trivy)
        env:
          ARBOR_API_KEY: ${{ secrets.ARBOR_API_KEY }}
          ARBOR_REQUIRED: "1"
        run: bash scripts/arbor-scan.sh app
