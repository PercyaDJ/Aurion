# Keeps the actions pinned by commit SHA up to date: one pull request per
# new version, with the SHA and the version comment updated together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days after a version is published: a hijacked release is usually
    # spotted and withdrawn within that time.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
