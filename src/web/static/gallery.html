<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurion — Galerie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .gallery-count {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .gallery-toolbar {
            display: none;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .gallery-toolbar.active {
            display: flex;
        }

        .gallery-toolbar .selection-count {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 600;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 0.5rem;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 4/3;
            background: var(--bg-input);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .gallery-item:hover {
            border-color: var(--accent);
            transform: scale(1.02);
        }

        .gallery-item.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent);
        }

        .gallery-item .select-checkbox {
            position: absolute;
            top: 6px;
            left: 6px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.6);
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: transparent;
            transition: all 0.15s ease;
        }

        .gallery-item.selected .select-checkbox {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-item .raw-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: var(--text-muted);
            font-size: 0.75rem;
            flex-direction: column;
            gap: 0.25rem;
            background: linear-gradient(135deg, var(--bg-card), var(--bg-input));
        }

        .gallery-item .raw-placeholder .raw-icon {
            font-size: 1.5rem;
        }

        .gallery-item .item-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 0.4rem 0.5rem;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
            font-size: 0.65rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            z-index: 2001;
        }

        .lightbox img {
            max-width: 95%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .lightbox-info {
            margin-top: 1rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .lightbox-actions {
            margin-top: 0.75rem;
            display: flex;
            gap: 0.75rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .empty-state p {
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* Delete confirmation modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 3000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            max-width: 320px;
            width: 90%;
            text-align: center;
        }

        .modal-box h3 {
            margin-bottom: 0.75rem;
            color: var(--red);
        }

        .modal-box p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .modal-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .modal-buttons .btn {
            flex: 1;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-brand">
            <img src="/icons/icon-192.png" alt="Aurion"
                style="width:28px;height:28px;vertical-align:middle;margin-right:6px;">
            <span>Aurion</span>
        </div>
        <button class="burger-btn" onclick="toggleMenu()" aria-label="Menu">☰</button>
    </nav>

    <!-- Side Menu -->
    <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
    <nav class="side-menu" id="sideMenu">
        <a href="/index.html"><span class="menu-icon">🏠</span> Accueil</a>
        <a href="/dashboard.html"><span class="menu-icon">📊</span> Dashboard</a>
        <a href="/preview.html"><span class="menu-icon">📷</span> Preview</a>
        <a href="/settings.html"><span class="menu-icon">⚙️</span> Réglages rapides</a>
        <a href="/settings_advanced.html"><span class="menu-icon">🔧</span> Réglages avancés</a>
        <a href="/presets.html"><span class="menu-icon">💾</span> Presets</a>
        <a href="/storage.html"><span class="menu-icon">💿</span> Stockage</a>
        <a href="/gallery.html" class="active"><span class="menu-icon">📸</span> Galerie</a>
        <a href="/diagnostics.html"><span class="menu-icon">📋</span> Diagnostics</a>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <div class="gallery-header">
            <h1>📸 Galerie</h1>
            <span class="gallery-count" id="galleryCount">Chargement...</span>
        </div>

        <!-- Tabs -->
        <div class="tab-bar"
            style="display:flex;gap:0.5rem;margin-bottom:1rem;border-bottom:1px solid var(--border);padding-bottom:0.5rem;">
            <button id="tabImages" class="tab-btn active"
                style="background:none;border:none;color:var(--accent);font-weight:600;padding:0.25rem 0.75rem;border-bottom:2px solid var(--accent);cursor:pointer;font-family:inherit;font-size:0.9rem;"
                onclick="switchTab('images')">🖼️ Toutes les images</button>
            <button id="tabSessions" class="tab-btn"
                style="background:none;border:none;color:var(--text-secondary);font-weight:500;padding:0.25rem 0.75rem;border-bottom:2px solid transparent;cursor:pointer;font-family:inherit;font-size:0.9rem;"
                onclick="switchTab('sessions')">🌙 Par session</button>
        </div>

        <!-- Toolbar (appears when selecting) -->
        <div class="gallery-toolbar" id="toolbar">
            <button class="btn btn-outline btn-sm" onclick="selectAll()">☑️ Tout sélectionner</button>
            <button class="btn btn-outline btn-sm" onclick="deselectAll()">✖️ Désélectionner</button>
            <span class="selection-count" id="selectionCount">0 sélectionné(s)</span>
            <div style="flex:1;"></div>
            <button class="btn btn-outline btn-sm" style="color:var(--green); border-color:var(--green);"
                onclick="downloadSelected()">⬇️ Télécharger ZIP</button>
            <button class="btn btn-outline btn-sm" style="color:var(--red); border-color:var(--red);"
                onclick="confirmDelete()">🗑️ Supprimer</button>
        </div>

        <!-- Tab: All images -->
        <div id="paneImages">
            <div id="galleryContent">
                <div class="empty-state">
                    <div class="empty-icon">⏳</div>
                    <p>Chargement de la galerie...</p>
                </div>
            </div>
        </div>

        <!-- Tab: Sessions -->
        <div id="paneSessions" style="display:none;">
            <div id="sessionsContent">
                <div class="empty-state">
                    <div class="empty-icon">⏳</div>
                    <p>Chargement des sessions...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <img id="lightboxImg" src="" alt="Preview">
        <div class="lightbox-info" id="lightboxInfo"></div>
        <div class="lightbox-actions">
            <a class="btn btn-primary btn-sm" id="lightboxDownload" href="#" download>
                ⬇️ Télécharger
            </a>
            <button class="btn btn-outline btn-sm" style="color:var(--red); border-color:var(--red);"
                id="lightboxDelete">
                🗑️ Supprimer
            </button>
        </div>
    </div>

    <!-- Delete confirmation modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal-box">
            <h3>⚠️ Supprimer ?</h3>
            <p id="deleteModalText">Supprimer les images sélectionnées ?</p>
            <div class="modal-buttons">
                <button class="btn btn-outline" onclick="closeDeleteModal()">Annuler</button>
                <button class="btn btn-outline" style="color:var(--red); border-color:var(--red);"
                    onclick="executeDelete()">Supprimer</button>
            </div>
        </div>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('sideMenu').classList.toggle('open');
            document.getElementById('menuOverlay').classList.toggle('visible');
        }

        // ── Tab switching ─────────────────────────────────────
        let sessionLoaded = false;

        function switchTab(tab) {
            const paneImages = document.getElementById('paneImages');
            const paneSessions = document.getElementById('paneSessions');
            const tabImages = document.getElementById('tabImages');
            const tabSessions = document.getElementById('tabSessions');
            const toolbar = document.getElementById('toolbar');

            if (tab === 'images') {
                paneImages.style.display = '';
                paneSessions.style.display = 'none';
                tabImages.style.color = 'var(--accent)';
                tabImages.style.borderBottom = '2px solid var(--accent)';
                tabSessions.style.color = 'var(--text-secondary)';
                tabSessions.style.borderBottom = '2px solid transparent';
                toolbar.style.display = ''; // restore managed by selectMode
            } else {
                paneImages.style.display = 'none';
                paneSessions.style.display = '';
                tabImages.style.color = 'var(--text-secondary)';
                tabImages.style.borderBottom = '2px solid transparent';
                tabSessions.style.color = 'var(--accent)';
                tabSessions.style.borderBottom = '2px solid var(--accent)';
                toolbar.style.display = 'none';
                if (!sessionLoaded) {
                    sessionLoaded = true;
                    loadSessions();
                }
            }
        }

        async function loadSessions() {
            const container = document.getElementById('sessionsContent');
            try {
                const res = await fetch('/api/gallery/sessions');
                const sessions = await res.json();

                if (!sessions || sessions.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">🌙</div>
                            <p>Aucune session enregistrée.<br>Les sessions apparaissent après la première nuit de capture.</p>
                        </div>`;
                    return;
                }

                let html = '<div style="display:flex;flex-direction:column;gap:0.75rem;">';
                for (const s of sessions) {
                    const rate = s.image_count > 0
                        ? Math.round(s.aurora_count / s.image_count * 100)
                        : 0;
                    const rateColor = rate > 30 ? 'var(--green)' : rate > 5 ? 'var(--accent)' : 'var(--text-secondary)';
                    const duration = s.duration_minutes > 0
                        ? `${Math.floor(s.duration_minutes / 60)}h${String(s.duration_minutes % 60).padStart(2, '0')}`
                        : '—';

                    html += `
                    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;display:flex;flex-direction:column;gap:0.5rem;">
                        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem;">
                            <div>
                                <div style="font-weight:600;font-size:0.95rem;">${s.date.replace(/\//g, ' / ')}</div>
                                <div style="font-size:0.75rem;color:var(--text-secondary);">${s.name}</div>
                            </div>
                            <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
                                ${s.aurora_count > 0 ? `<span style="background:rgba(0,255,120,0.15);color:var(--green);border:1px solid var(--green);border-radius:20px;padding:0.15rem 0.6rem;font-size:0.75rem;font-weight:600;">🌌 ${s.aurora_count} aurore${s.aurora_count > 1 ? 's' : ''}</span>` : ''}
                                <span style="color:${rateColor};font-size:0.8rem;font-weight:500;">${rate}% détection</span>
                            </div>
                        </div>
                        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem;margin-top:0.25rem;">
                            <div style="display:flex;gap:1rem;font-size:0.8rem;color:var(--text-secondary);flex-wrap:wrap;">
                                <span>📸 ${s.image_count} image${s.image_count > 1 ? 's' : ''}</span>
                                <span>⏱ ${duration}</span>
                                ${s.has_log ? '<span style="color:var(--green);">📋 Logs disponibles</span>' : ''}
                            </div>
                            <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
                                <button onclick="confirmDeleteSession('${s.name}')" class="btn btn-outline btn-sm" style="color:var(--red,#ff4d4d);border:1px solid var(--red,#ff4d4d);padding:0.25rem 0.75rem;font-size:0.8rem;background:transparent;border-radius:var(--radius);cursor:pointer;">
                                    🗑️ Supprimer
                                </button>
                                <a href="/api/gallery/sessions/${s.name}/download" class="btn btn-outline btn-sm" style="color:var(--green);border-color:var(--green);padding:0.25rem 0.75rem;font-size:0.8rem;text-decoration:none;">
                                    ⬇️ Télécharger ZIP
                                </a>
                            </div>
                        </div>
                    </div>`;
                }
                html += '</div>';
                container.innerHTML = html;

            } catch (e) {
                container.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><p>Impossible de charger les sessions.</p></div>`;
            }
        }

        let allImages = [];
        let selectedFiles = new Set();
        let selectMode = false;

        async function loadGallery() {
            try {
                const res = await fetch('/api/gallery');
                const data = await res.json();
                const container = document.getElementById('galleryContent');
                const countEl = document.getElementById('galleryCount');

                allImages = data.images || [];

                if (allImages.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📭</div>
                            <p>Aucune image capturée.<br>Lancez une session de capture pour commencer.</p>
                        </div>`;
                    countEl.textContent = '0 images';
                    return;
                }

                countEl.textContent = `${data.total_count} images — ${data.total_size_mb.toFixed(1)} Mo`;
                renderGrid();

            } catch (e) {
                console.error('Gallery load failed:', e);
                document.getElementById('galleryContent').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <p>Impossible de charger la galerie.<br>Vérifiez que la clé USB est montée.</p>
                    </div>`;
            }
        }

        function renderGrid() {
            let html = '<div class="gallery-grid">';
            for (const img of allImages) {
                const ext = img.filename.split('.').pop().toLowerCase();
                const isRaw = ext === 'dng' || ext === 'raw';
                const isSelected = selectedFiles.has(img.filename);
                const selectedClass = isSelected ? ' selected' : '';

                if (isRaw) {
                    html += `
                        <div class="gallery-item${selectedClass}" data-filename="${img.filename}"
                             onclick="handleItemClick(event, '${img.filename}', '${img.size_display}', '${img.modified}', true)">
                            <div class="select-checkbox">✓</div>
                            <div class="raw-placeholder">
                                <span class="raw-icon">🎞️</span>
                                <span>RAW</span>
                            </div>
                            <div class="item-info">${img.filename}</div>
                        </div>`;
                } else {
                    html += `
                        <div class="gallery-item${selectedClass}" data-filename="${img.filename}"
                             onclick="handleItemClick(event, '${img.filename}', '${img.size_display}', '${img.modified}', false)">
                            <div class="select-checkbox">✓</div>
                            <img src="/api/gallery/thumbnail/${img.filename}" alt="${img.filename}" loading="lazy"
                                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="raw-placeholder" style="display:none;">
                                <span class="raw-icon">🖼️</span>
                            </div>
                            <div class="item-info">${img.filename}</div>
                        </div>`;
                }
            }
            html += '</div>';
            document.getElementById('galleryContent').innerHTML = html;
        }

        function handleItemClick(event, filename, size, modified, isRaw) {
            // If we click directly on the select checkbox, toggle selection immediately
            if (event.target.classList.contains('select-checkbox')) {
                toggleSelect(filename);
                // Also enter select mode if not already
                if (!selectMode) enterSelectMode();
                return;
            }

            if (selectMode) {
                toggleSelect(filename);
            } else {
                openLightbox(filename, size, modified, isRaw);
            }
        }

        function toggleSelect(filename) {
            if (selectedFiles.has(filename)) {
                selectedFiles.delete(filename);
            } else {
                selectedFiles.add(filename);
            }
            updateSelectionUI();
        }

        function enterSelectMode() {
            selectMode = true;
            document.getElementById('toolbar').classList.add('active');
        }

        function updateSelectionUI() {
            if (selectedFiles.size === 0) {
                selectMode = false;
                document.getElementById('toolbar').classList.remove('active');
            } else {
                enterSelectMode();
            }
            document.getElementById('selectionCount').textContent = selectedFiles.size + ' sélectionné(s)';

            // Update visuals
            document.querySelectorAll('.gallery-item').forEach(el => {
                const fn = el.dataset.filename;
                if (selectedFiles.has(fn)) {
                    el.classList.add('selected');
                } else {
                    el.classList.remove('selected');
                }
            });
        }

        function selectAll() {
            allImages.forEach(img => selectedFiles.add(img.filename));
            updateSelectionUI();
        }

        function deselectAll() {
            selectedFiles.clear();
            updateSelectionUI();
        }

        // Long press to enter select mode on mobile
        let longPressTimer = null;
        document.addEventListener('touchstart', e => {
            const item = e.target.closest('.gallery-item');
            if (!item) return;
            longPressTimer = setTimeout(() => {
                const fn = item.dataset.filename;
                enterSelectMode();
                toggleSelect(fn);
            }, 500);
        });
        document.addEventListener('touchend', () => clearTimeout(longPressTimer));
        document.addEventListener('touchmove', () => clearTimeout(longPressTimer));

        let pendingDeleteFiles = [];
        let pendingDeleteSession = null;

        function confirmDelete() {
            pendingDeleteSession = null;
            pendingDeleteFiles = Array.from(selectedFiles);
            if (pendingDeleteFiles.length === 0) return;
            document.getElementById('deleteModalText').textContent =
                `Supprimer ${pendingDeleteFiles.length} image(s) ? Cette action est irréversible.`;
            document.getElementById('deleteModal').classList.add('active');
        }

        function confirmDeleteSingle(filename) {
            pendingDeleteSession = null;
            pendingDeleteFiles = [filename];
            document.getElementById('deleteModalText').textContent =
                `Supprimer "${filename}" ? Cette action est irréversible.`;
            document.getElementById('deleteModal').classList.add('active');
        }

        function confirmDeleteSession(sessionName) {
            pendingDeleteFiles = [];
            pendingDeleteSession = sessionName;
            document.getElementById('deleteModalText').textContent =
                `Supprimer la nuit complète "${sessionName}" ? Toutes les photos et logs seront définitivement effacés.`;
            document.getElementById('deleteModal').classList.add('active');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
            pendingDeleteFiles = [];
            pendingDeleteSession = null;
        }

        async function executeDelete() {
            closeDeleteModal();
            try {
                if (pendingDeleteSession) {
                    const res = await fetch(`/api/gallery/sessions/${pendingDeleteSession}`, { method: 'DELETE' });
                    if (!res.ok) throw new Error('Erreur serveur au téléchargement');
                    showToast('Session supprimée ✅', 'success');
                    pendingDeleteSession = null;
                    if (currentTab === 'sessions') {
                        loadGallerySessions();
                    } else {
                        loadGallery();
                    }
                    return;
                }

                const res = await fetch('/api/gallery/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filenames: pendingDeleteFiles }),
                });
                const data = await res.json();
                // Remove deleted from selection
                pendingDeleteFiles.forEach(f => selectedFiles.delete(f));
                updateSelectionUI();
                
                showToast(`${data.deleted} image(s) supprimée(s)`, 'success');
                
                // Reload current view
                if (currentTab === 'sessions') {
                    loadGallerySessions();
                } else {
                    loadGallery();
                }
            } catch (e) {
                showToast('Erreur suppression: ' + e.message, 'error');
            }
        }

        // Download selected as ZIP
        function downloadSelected() {
            const files = Array.from(selectedFiles);
            if (files.length === 0) {
                showToast('Aucune image sélectionnée', 'info');
                return;
            }
            showToast(`Téléchargement de ${files.length} image(s)...`, 'info');

            // Create a hidden form to submit natively (avoids JS fetch RAM crashes on big files)
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/api/gallery/download-zip';
            form.style.display = 'none';

            files.forEach(fn => {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'filenames';
                input.value = fn;
                form.appendChild(input);
            });

            document.body.appendChild(form);
            form.submit();
            setTimeout(() => document.body.removeChild(form), 1000);

            // Deselect all after download starts
            deselectAll();
            showToast('Téléchargement lancé ✅', 'success');
        }

        // Lightbox
        let currentLightboxFile = '';

        function openLightbox(filename, size, modified, isRaw) {
            currentLightboxFile = filename;
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightboxImg');
            const info = document.getElementById('lightboxInfo');
            const download = document.getElementById('lightboxDownload');
            const deleteBtn = document.getElementById('lightboxDelete');

            if (isRaw) {
                img.src = '';
                img.style.display = 'none';
            } else {
                img.src = `/api/gallery/thumbnail/${filename}`;
                img.style.display = 'block';
            }

            info.innerHTML = `<strong>${filename}</strong><br>${size} — ${modified}`;
            download.href = `/api/gallery/${filename}`;
            download.download = filename;
            deleteBtn.onclick = () => { closeLightbox(); confirmDeleteSingle(filename); };

            lightbox.classList.add('active');
        }

        function closeLightbox(event) {
            if (event && event.target !== event.currentTarget && !event.target.classList.contains('lightbox-close')) return;
            document.getElementById('lightbox').classList.remove('active');
        }

        // ESC to close
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeLightbox();
                closeDeleteModal();
            }
        });

        loadGallery();
    </script>
    <script src="/js/toast.js"></script>

</body>

</html>
